# Checks for the two project copies: Python 3.8 unit tests, byte-compile,
# tab indentation (MDK style), robot/sim copies in sync, shell scripts, and
# a secret scan so API keys never reach the repository again.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: python:3.8-slim
    strategy:
      fail-fast: false
      matrix:
        project: [cloud_demo_robot, cloud_demo_sim]
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends ffmpeg
          pip install --quiet numpy==1.24.4 pyyaml requests "openai>=1.55.3,<2" pvporcupine==3.0.4 pvcobra==2.0.4
      - name: Byte-compile and check indentation
        working-directory: src/${{ matrix.project }}
        run: |
          python -m compileall -q core tools tests
          python -m tabnanny core tools tests
      - name: Unit tests
        working-directory: src/${{ matrix.project }}
        run: python -m unittest discover -s tests -v

  copies-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_copies.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x docker/*.sh docker/*.bash src/*/run_*.sh src/*/tools/*.bash

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 -v
