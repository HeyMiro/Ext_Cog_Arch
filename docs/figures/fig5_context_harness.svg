<text x="129.0" y="67.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">valence, arousal, sleep</text>
<text x="129.0" y="79.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">the running behaviour</text>
