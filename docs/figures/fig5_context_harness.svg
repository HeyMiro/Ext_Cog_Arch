<rect x="14.0" y="556.0" width="972.0" height="64.0" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
<text x="26.0" y="574.0" font-size="9.2" font-weight="bold" text-anchor="start" fill="#222222">Measured once at start-up:</text>
<text x="196.0" y="574.0" font-size="9" font-weight="normal" text-anchor="start" fill="#222222">GET /props gives 8,192 tokens per request; /apply-template + /tokenize give the prefix and characters per token.</text>
<text x="26.0" y="590.0" font-size="9.2" font-weight="bold" text-anchor="start" fill="#222222">Every turn after that:</text>
<text x="196.0" y="590.0" font-size="9" font-weight="normal" text-anchor="start" fill="#222222">estimates only: no extra model call, no network call. Logged per turn, e.g. [context] prompt ~2754 / 8192 tokens.</text>
