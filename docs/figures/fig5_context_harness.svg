<text x="129.0" y="315.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">name · facts · topics</text>
<text x="129.0" y="327.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">recalled only by name</text>
<rect x="30.0" y="357.5" width="36.0" height="11.5" rx="5.5" fill="#eeeeee" stroke="#5b5b5b" stroke-width="0.8"/>
<text x="48.0" y="366.0" font-size="7.6" font-weight="bold" text-anchor="middle" fill="#5b5b5b">limit</text>
<text x="72.0" y="366.0" font-size="8.6" font-weight="normal" text-anchor="start" fill="#5b5b5b" font-style="italic">5 facts · 50 people</text>
<text x="72.0" y="380.0" font-size="8.6" font-weight="normal" text-anchor="start" fill="#5b5b5b" font-style="italic">forgotten after 24 h</text>
