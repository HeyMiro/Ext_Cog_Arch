<text x="381.0" y="479.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">the person's lines; MiRo's</text>
<text x="381.0" y="491.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">question before a short answer</text>
