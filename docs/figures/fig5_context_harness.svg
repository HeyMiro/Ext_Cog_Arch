<text x="395.0" y="112.0" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222222">Speech-to-text</text>
<text x="395.0" y="127.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">the person's words</text>
<rect x="278.0" y="137.5" width="36.0" height="11.5" rx="5.5" fill="#eeeeee" stroke="#5b5b5b" stroke-width="0.8"/>
<text x="296.0" y="146.0" font-size="7.6" font-weight="bold" text-anchor="middle" fill="#5b5b5b">limit</text>
<text x="320.0" y="146.0" font-size="8.6" font-weight="normal" text-anchor="start" fill="#5b5b5b" font-style="italic">150 tokens</text>
<rect x="270.0" y="164.0" width="250.0" height="226.0" rx="4" fill="#e6effa" stroke="#2c64ad" stroke-width="1.1"/>
<text x="395.0" y="182.0" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222222">The note</text>
<text x="395.0" y="197.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">one bracketed note in front</text>
<text x="395.0" y="209.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">of the person's words:</text>
<text x="395.0" y="221.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333"></text>
<text x="395.0" y="233.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">Now · self-state · Recently ·</text>
<text x="395.0" y="245.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">Scene · You remember · reminder</text>
<text x="395.0" y="257.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333"></text>
<text x="395.0" y="269.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">no events: "Recently: nothing"</text>
<text x="395.0" y="281.0" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">(so the model invents none)</text>
<rect x="278.0" y="343.5" width="36.0" height="11.5" rx="5.5" fill="#eeeeee" stroke="#5b5b5b" stroke-width="0.8"/>
<text x="296.0" y="352.0" font-size="7.6" font-weight="bold" text-anchor="middle" fill="#5b5b5b">limit</text>
