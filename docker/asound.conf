# Route ALSA's default device to PulseAudio. The host's PulseAudio (or
# PipeWire-pulse) socket is mounted at /run/pulse/native by run_docker.bash.
# PortAudio (sounddevice) on Ubuntu 20.04 reaches PulseAudio through this,
# and PulseAudio does the resampling (e.g. to the 20 kHz MiRo mic rate).
pcm.!default {
	type pulse
	fallback "sysdefault"
	hint {
		show on
		description "PulseAudio (host)"
	}
}
ctl.!default {
	type pulse
	fallback "sysdefault"
}
